name: Build desktop apps

on:
  push:
    branches: [main, desktop-builds, 'release/v*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'pyinstaller>=6.14,<7' pytest
      - run: python -m pytest -q
      - name: Package and smoke test
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --windowed --onedir --name JHenkan --icon assets/jhenkan-d-kan.ico --add-data 'assets:assets' --hidden-import keyring.backends.Windows app.pyw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath .\dist\JHenkan\JHenkan.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Copy-Item LICENSE dist/JHenkan/
          Compress-Archive -Path dist/JHenkan -DestinationPath JHenkan-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JHenkan-windows-x64
          path: JHenkan-windows-x64.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=cryptography -r requirements-macos.txt 'pyinstaller>=6.14,<7' pytest
      - run: python -m pytest -q tests/test_converter.py tests/test_mac_text.py
      - name: Package and smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python -m PyInstaller --noconfirm --windowed --onedir --name JHenkan --osx-bundle-identifier io.github.hakoshie.jhenkan --icon assets/jhenkan-d-kan.png mac_app.py
          dist/JHenkan.app/Contents/MacOS/JHenkan --smoke-test
          file dist/JHenkan.app/Contents/MacOS/JHenkan | grep -F "$ARCH"
          ditto -c -k --sequesterRsrc --keepParent dist/JHenkan.app "JHenkan-macos-$ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: JHenkan-macos-${{ matrix.arch }}
          path: JHenkan-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: JHenkan-*
          path: release-assets
          merge-multiple: true
      - name: Publish the verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${BUILD_REF#release/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release-assets
          archives=(JHenkan-windows-x64.zip JHenkan-macos-arm64.zip JHenkan-macos-x86_64.zip)
          for archive in "${archives[@]}"; do
            test -s "$archive"
            unzip -tq "$archive"
          done
          if [[ "$BUILD_REF" == release/* ]]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "Refusing to use an existing tag from a bootstrap branch." >&2
              exit 1
            fi
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$BUILD_SHA" --silent
          fi
          gh release create "$tag" "${archives[@]}" --verify-tag --title "JHenkan $tag" --notes "Windows x64 and macOS Apple Silicon/Intel. macOS requires Accessibility permission and is not notarized."
